# SignBridge AI - Reverse Proxy Configuration (Nginx)
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    upstream signbridge_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Static Files
        location / {
            root /app/frontend/dist;
            try_files $uri $uri/ /index.html;
        }

        # Backend API Reverse Proxy
        location /api/ {
            proxy_pass http://signbridge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Static media (videos / avatar keyframes)
        location /data/ {
            proxy_pass http://signbridge_backend/data/;
            proxy_set_header Host $host;
        }

        # Health Probes
        location /health {
            proxy_pass http://signbridge_backend/api/v1/health;
        }
    }
}
