version: '3.8'

services:
  signbridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: signbridge-ai:pre-pilot-v1.0
    container_name: signbridge_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SIGNBRIDGE_ENV=production
      - SIGNBRIDGE_DEBUG=False
      - SIGNBRIDGE_SECRET_KEY=change_me_to_a_production_random_secret_key_32_chars
      - SIGNBRIDGE_TOKEN_EXP_SECONDS=604800
      - SIGNBRIDGE_RATE_LIMIT=120
      - SIGNBRIDGE_DATABASE_URL=sqlite:////app/backend/signbridge.db
    volumes:
      - signbridge_data:/app/data
      - signbridge_backups:/app/data/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  signbridge_data:
    driver: local
  signbridge_backups:
    driver: local

